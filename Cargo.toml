[package]
name = "explorateur"
version = "0.2.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
crossbeam-channel = "0.5.17"
dirs = "7.0.0"
egui = "0.37.0"
# Fenêtre + rendu CPU (pas de contexte GPU) : softbuffer présente l'image via GDI.
egui-winit = { version = "0.37.0", default-features = false, features = ["clipboard", "links"] }
winit = "0.30.13"
softbuffer = "0.4.8"
hdrshot-egui-backend = "0.2.0"
bytemuck = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
notify = "8.2.2"
open = "5.4.5"
trash = "5.4.0"
drag = "2.1.1"
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Ole", "Win32_UI_WindowsAndMessaging", "Win32_System_Registry", "Win32_System_Threading"] }
# Miniatures Windows (vidéos, PDF, Office…) via IShellItemImageFactory
windows = { version = "0.58", features = ["Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_Foundation"] }
regex = "1.13.2"
zip = { version = "9.7.3", default-features = false, features = ["deflate"] }
rayon = "1.12.0"
ignore = "0.4.34"
memchr = "2.8.3"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

[build-dependencies]
winresource = "0.1.34"
